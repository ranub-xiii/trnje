name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile source and tests
        run: python -m compileall -q trnje scripts tests
      - name: Validate Termux installer shell syntax
        run: bash -n scripts/install_trnje_termux_worker.sh
